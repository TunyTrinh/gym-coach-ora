<circle cx="150" cy="150" r="55" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-dasharray="278 67" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(11, 11, 11);stroke-width:16px;stroke-dasharray:278px, 67px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
