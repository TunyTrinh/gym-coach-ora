<text x="150" y="315" text-anchor="middle" font-family="Anthropic Sans, sans-serif" font-weight="500" font-size="26" fill="var(--text-primary)" letter-spacing="4" style="fill:rgb(11, 11, 11);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:26px;font-weight:500;text-anchor:middle;dominant-baseline:auto">COACHORA</text>
