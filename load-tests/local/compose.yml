services:
  mysql:
    image: mysql:8.4
    container_name: coachora-local-load-mysql
    environment:
      MYSQL_DATABASE: ${COACHORA_LOCAL_DB_NAME:-coachora_load_test}
      MYSQL_USER: ${COACHORA_LOCAL_DB_USER:-coachora_load}
      MYSQL_PASSWORD: ${COACHORA_LOCAL_DB_PASSWORD:?set a local test password in the shell}
      MYSQL_ROOT_PASSWORD: ${COACHORA_LOCAL_DB_ROOT_PASSWORD:?set a local root password in the shell}
    # The sandbox does not permit Docker bridge-network iptables rules. Host mode
    # is still local-only because mysqld is explicitly bound to loopback below.
    network_mode: host
    command: ["mysqld", "--bind-address=127.0.0.1", "--port=${COACHORA_LOCAL_DB_PORT:-3307}"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 24
    tmpfs:
      - /var/lib/mysql
