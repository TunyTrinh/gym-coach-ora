services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SELF_HOSTED: "true"
      PORT: 3000
      STATIC_DIR: /app/web
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      APP_BASE_URL: https://${APP_DOMAIN}
      GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/google/callback
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate && node dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal, edge]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]

  backup:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
    volumes:
      - ./backups:/backups
      - ./deployment/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
